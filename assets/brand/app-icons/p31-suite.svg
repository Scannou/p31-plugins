<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<title>P31 Suite</title>
<!-- App icon: the P31 mark's ring as a round CRT screen showing what the app shows: the three
     panels, each in its own app's phosphor colour, behind a P4 white (#E6EDF2) ring. Tile: 824 x 824
     at 100,100, as macOS app icons are laid out. Rendered to an .icns by scripts/icons.sh. -->
<defs>
<linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#1C2024"/>
<stop offset="1" stop-color="#0B0D0F"/>
</linearGradient>
<radialGradient id="screen" cx="0.5" cy="0.5" r="0.5">
<stop offset="0" stop-color="#E6EDF2" stop-opacity="0.08"/>
<stop offset="1" stop-color="#E6EDF2" stop-opacity="0.02"/>
</radialGradient>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
<feGaussianBlur stdDeviation="14"/>
</filter>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
<feGaussianBlur stdDeviation="1.8"/>
</filter>
<clipPath id="inside"><circle cx="50" cy="50" r="45.5"/></clipPath>
<clipPath id="spectrum"><rect x="40.0" y="0" width="60" height="50.0"/></clipPath>
<linearGradient id="fill" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
<stop offset="0" stop-color="#6FB7FF" stop-opacity="0.42"/>
<stop offset="1" stop-color="#6FB7FF" stop-opacity="0.04"/>
</linearGradient>
</defs>
<rect x="100" y="112" width="824" height="824" rx="185" fill="#000" fill-opacity="0.35" filter="url(#shadow)"/>
<rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>
<rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#fff" stroke-opacity="0.07" stroke-width="3"/>
