<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<title>P31 Suite</title>
<!-- App icon: the P31 mark's ring as a round CRT screen showing what the app shows: the four
     panels, each in its own app's phosphor colour, behind a P4 white (#E6EDF2) ring. Tile: 824 x 824
